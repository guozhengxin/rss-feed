<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>硅基野人 · 每日早报</title>
<meta name="description" content="电商动态、运营实战、AI 热点与市场风向，每天更新。">
<link rel="alternate" type="application/rss+xml" title="硅基野人 · 每日早报" href="rss.xml">
<style>
  :root{
    --bg:#f7f4ee;--paper:#fffdf8;--ink:#14202e;--muted:#687382;
    --line:#e8e1d5;--blue:#2563eb;--blue-soft:#e9f0ff;
    --green:#16835b;--green-soft:#e8f6ee;--purple:#7c3aed;--purple-soft:#f1ecff;
    --amber:#a16207;--amber-soft:#fff6df;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue);text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:34px 24px 48px}
  .hero{
    position:relative;overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(135deg,#fffdf8 0%,#fff8ec 55%,#f2f7ff 100%);
    border-radius:22px;padding:30px 32px 26px;
    box-shadow:0 18px 50px rgba(61,47,25,.07);
  }
  .hero::after{
    content:"";position:absolute;right:-70px;top:-100px;width:280px;height:280px;
    border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.13),transparent 68%);
  }
  .eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--blue)}
  h1{font-size:32px;line-height:1.3;letter-spacing:-.02em;margin:9px 0 8px;position:relative;z-index:1}
  .desc{margin:0;color:var(--muted);font-size:13.5px;line-height:1.8;max-width:620px}
  .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;position:relative;z-index:1}
  .updated{font-size:11.5px;color:#8a8173}
  .copy{
    border:1px solid #d8e2f6;background:var(--blue-soft);color:#1d4ed8;
    border-radius:999px;padding:8px 14px;font:700 11.5px/1 inherit;cursor:pointer;
  }
  .copy:hover{background:#dbe7ff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:20px 21px 18px;box-shadow:0 10px 28px rgba(61,47,25,.045);
    min-width:0;
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .tag{font-size:11px;font-weight:800;letter-spacing:.5px;border-radius:999px;padding:5px 10px;white-space:nowrap}
  .tag.ec{color:var(--blue);background:var(--blue-soft)}
  .tag.ops{color:var(--green);background:var(--green-soft)}
  .tag.ai{color:var(--purple);background:var(--purple-soft)}
  .tag.wind{color:var(--amber);background:var(--amber-soft)}
  .date{font-size:10.5px;color:#9b9a94;white-space:nowrap}
  h2{font-size:16px;line-height:1.55;margin:0 0 9px;letter-spacing:-.01em}
  ul{margin:0;padding:0;list-style:none}
  li{position:relative;padding-left:14px;margin:7px 0;color:#4b5664;font-size:12.5px;line-height:1.75}
  li::before{content:"";position:absolute;left:1px;top:.72em;width:5px;height:5px;border-radius:50%;background:#c8bda9}
  .card.ec li::before{background:#93b4f5}
  .card.ops li::before{background:#8bcfb2}
  .card.ai li::before{background:#c4a8f8}
  .card.wind li::before{background:#e3c27c}
  .loading,.error{
    grid-column:1/-1;text-align:center;color:#8a8173;font-size:13px;
    border:1px dashed #d9d0c0;border-radius:16px;padding:40px 20px;background:rgba(255,253,248,.65)
  }
  .error a{font-weight:700}
  footer{
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
    color:#9b9488;font-size:11px;line-height:1.7;
  }
  footer b{color:#6f675b}
  @media(max-width:760px){
    .wrap{padding:18px 14px 34px}
    .hero{padding:22px 18px 20px;border-radius:18px}
    h1{font-size:25px}
    .grid{grid-template-columns:1fr;gap:12px}
    .card{padding:17px 17px 15px;border-radius:15px}
    h2{font-size:15px}
    li{font-size:12.5px}
    .meta{margin-top:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">DAILY BRIEF</div>
    <h1 id="feed-title">硅基野人 · 每日早报</h1>
    <p class="desc" id="feed-desc">电商动态、运营实战、AI 热点与市场风向，每天更新。</p>
    <div class="meta">
      <span class="updated" id="updated">正在读取更新日期…</span>
      <button class="copy" id="copyRss" type="button">复制 RSS 地址</button>
    </div>
  </header>

  <main class="grid" id="cards" aria-live="polite">
    <div class="loading">正在读取今天的早报…</div>
  </main>

  <footer>
    <span><b>硅基野人 · 每日早报</b> · 每天 05:00 左右更新</span>
    <span>仅供阅读 · RSS 地址可复制到快捷指令</span>
  </footer>
</div>

<script>
(function(){
  'use strict';
  var cards = document.getElementById('cards');
  var titleEl = document.getElementById('feed-title');
  var descEl = document.getElementById('feed-desc');
  var updatedEl = document.getElementById('updated');
  var copyBtn = document.getElementById('copyRss');

  function displayName(s){ return String(s || '').replace(/郭政鑫/g, '硅基野人'); }

  var cats = {
    '电商动态': {cls:'ec', name:'电商动态'},
    '运营实战': {cls:'ops', name:'运营实战'},
    'A-I热点': {cls:'ai', name:'AI 热点'},
    'AI热点': {cls:'ai', name:'AI 热点'},
    '市场风向': {cls:'wind', name:'市场风向'}
  };

  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function parseTitle(raw){
    var t = String(raw || '').replace(/\s+/g,' ').trim();
    var m = t.match(/^(日报|工作|电商动态|运营实战|A-I热点|AI热点|市场风向)[:：]\s*(.*)$/);
    if(!m) return {cat:'', body:t, facts:[]};
    var body = m[2].replace(/，。/g,'。').replace(/。\s*$/,'').trim();
    var facts = body.split('。').map(function(x){return x.replace(/^[，,、\s]+|[，,、\s]+$/g,'').trim();}).filter(function(x){return x.length > 2;});
    return {cat:m[1], body:body, facts:facts};
  }

  function dateText(pub){
    if(!pub) return '';
    var d = new Date(pub);
    if(isNaN(d.getTime())) return '';
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }

  function isWorkItem(item, index){
    var title = String(item.querySelector('title')?.textContent || '');
    var guid = String(item.querySelector('guid')?.textContent || '');
    // 工作日报只从公开页面隐藏；rss.xml 原文件保持不动。
    return /^日报[:：]/.test(title) || /^工作[:：]/.test(title) || /^daily-report-/.test(guid);
  }

  function render(xml){
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('RSS 解析失败');
    var ch = doc.querySelector('channel');
    if(!ch) throw new Error('RSS 内容为空');

    var channelTitle = displayName(ch.querySelector('title')?.textContent || '每日早报');
    var channelDesc = displayName(ch.querySelector('description')?.textContent || '');
    titleEl.textContent = channelTitle;
    descEl.textContent = channelDesc;

    var last = ch.querySelector('lastBuildDate')?.textContent || '';
    if(last){
      var d = new Date(last);
      if(!isNaN(d.getTime())){
        updatedEl.textContent = '更新于 ' + d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      }
    }

    var items = Array.from(ch.querySelectorAll(':scope > item'));
    var html = '';
    var shown = 0;
    items.forEach(function(item, i){
      if(isWorkItem(item, i)) return;
      var raw = displayName(item.querySelector('title')?.textContent || '');
      var parsed = parseTitle(raw);
      var cfg = cats[parsed.cat] || {cls:'ec', name: parsed.cat || '早报'};
      var date = dateText(item.querySelector('pubDate')?.textContent || '');
      var facts = parsed.facts.length ? parsed.facts : [parsed.body];
      var heading = facts.length ? facts[0] : raw;
      var rest = facts.slice(1);
      html += '<article class="card ' + cfg.cls + '">'
        + '<div class="card-head"><span class="tag ' + cfg.cls + '">' + esc(cfg.name) + '</span>'
        + (date ? '<span class="date">' + esc(date) + '</span>' : '') + '</div>'
        + '<h2>' + esc(heading) + '</h2>'
        + (rest.length ? '<ul>' + rest.map(function(x){return '<li>'+esc(x)+'</li>';}).join('') + '</ul>' : '')
        + '</article>';
      shown++;
    });
    cards.innerHTML = html || '<div class="error">今天暂时没有可读的条目，<a href="rss.xml">查看 RSS 源文件</a>。</div>';
  }

  function fail(err){
    updatedEl.textContent = '读取失败';
    cards.innerHTML = '<div class="error">早报暂时读取失败，稍后刷新试试。<br><a href="rss.xml">打开 RSS 源文件</a></div>';
    console.warn(err);
  }

  function load(){
    fetch('rss.xml?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(render).catch(fail);
  }

  copyBtn.addEventListener('click', function(){
    var base = location.href.replace(/index\.html([?#].*)?$/, '').replace(/\/?$/, '/');
    var url = base + 'rss.xml';
    var done = function(){
      copyBtn.textContent = '已复制';
      setTimeout(function(){ copyBtn.textContent = '复制 RSS 地址'; }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){});
    } else {
      var ta = document.createElement('textarea');
      ta.value = url; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) {}
      ta.remove();
    }
  });

  load();
})();
</script>
</body>
</html>
